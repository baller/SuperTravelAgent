[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "supertravel-api"
version = "0.1.0"
description = "Trip-centered AI travel concierge API"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.4",
  "arq==0.26.3",
  "asyncpg==0.30.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "langchain-core==0.3.72",
  "langgraph==0.6.4",
  "langgraph-checkpoint-postgres==2.0.23",
  "mcp==1.12.4",
  "openai==1.99.1",
  "orjson==3.11.1",
  "pgvector==0.4.1",
  "psycopg[binary,pool]==3.2.9",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "python-dateutil==2.9.0.post0",
  "python-multipart==0.0.20",
  "redis==5.2.1",
  "sqlalchemy==2.0.42",
  "sse-starlette==2.4.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires a running Docker stack with real provider keys",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
